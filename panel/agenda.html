<!DOCTYPE html>
<html lang="es" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waitcars - Agenda y Control de Cobros</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b3b82',
                            primary: '#1d8ef1',
                            accent: '#00c6ff',
                            slate: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            touch-action: manipulation;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b1329;
            color: #f8fafc;
        }

        input, select, textarea, button {
            font-size: 16px !important;
        }

        .dashboard-bg {
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 142, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 198, 255, 0.08) 0px, transparent 50%),
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .modal-blur {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(11, 19, 41, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(29, 142, 241, 0.35);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen dashboard-bg text-slate-100 p-3 sm:p-6 relative">

    <!-- CABECERA PRINCIPAL -->
    <div class="flex flex-col items-center text-center max-w-2xl mx-auto mb-6 pt-2">
        <span class="px-3 py-1 rounded-full bg-brand-primary/10 border border-brand-primary/20 text-brand-primary text-[10px] font-black uppercase tracking-widest shadow-sm shadow-brand-primary/20 mb-2.5 flex items-center gap-1.5">
            <i class="fas fa-calendar-days text-xs"></i> Control de Operaciones
        </span>
        
        <h2 class="text-2xl sm:text-3xl font-black text-white tracking-tight flex items-center justify-center gap-3">
            <i class="fas fa-clock text-brand-primary"></i> Agenda de Turnos y Cobros
        </h2>
        
        <p class="text-xs sm:text-sm text-slate-400 mt-1.5 font-medium max-w-lg leading-relaxed">
            Visualiza los turnos ordenados por horario, registra el estado de pago de los servicios y administra tus medios de cobro.
        </p>

        <!-- NAVEGADOR DE FECHA Y BOTÓN NUEVO MÉTODO -->
        <div class="mt-4 flex flex-wrap items-center justify-center gap-2.5">
            <input 
                type="date" 
                id="agenda-date-picker" 
                onchange="loadAgendaTurnos()" 
                class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs font-bold text-white focus:outline-none focus:border-brand-primary cursor-pointer shadow-md"
            >
            <button 
                onclick="openModal('modal-nuevo-metodo')" 
                class="px-3.5 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-bold hover:bg-slate-700 transition-all flex items-center gap-2 shadow-md cursor-pointer"
            >
                <i class="fas fa-wallet text-brand-accent"></i> Gestionar Pagos
            </button>
        </div>
    </div>

    <!-- LISTADO DE TURNOS DEL DÍA -->
    <div class="max-w-4xl mx-auto space-y-3.5 relative z-10" id="agenda-turnos-container">
        <!-- Generado dinámicamente -->
    </div>


    <!-- MODAL: GESTIONAR MÉTODOS DE PAGO -->
    <div id="modal-nuevo-metodo" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 modal-blur">
        <div class="glass-card w-full max-w-md rounded-3xl p-5 relative border border-slate-700 shadow-2xl bg-slate-900/90">
            <button onclick="closeModal('modal-nuevo-metodo')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-base">
                <i class="fas fa-xmark"></i>
            </button>
            
            <h3 class="text-base font-extrabold text-white flex items-center gap-2 mb-2">
                <i class="fas fa-wallet text-brand-accent"></i> Medios de Cobro
            </h3>
            <p class="text-xs text-slate-400 mb-4">Agrega nuevos métodos de pago personalizados para registrar en los turnos.</p>

            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="input-nuevo-metodo" placeholder="Ej: Tarjeta de Crédito, Mercado Pago..." class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2 px-3 text-xs text-white focus:outline-none focus:border-brand-primary">
                    <button onclick="addNewPaymentMethod()" class="px-4 py-2 bg-brand-primary text-white rounded-xl text-xs font-bold hover:bg-brand-primary/90 transition-all shadow-md shrink-0">
                        Agregar
                    </button>
                </div>

                <div class="pt-2">
                    <span class="text-[10px] font-black uppercase text-slate-400 tracking-wider block mb-2">Métodos Disponibles</span>
                    <div id="payment-methods-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- JAVASCRIPT -->
    <script>
        // MÉTODOS DE PAGO PREDETERMINADOS DE FÁBRICA
        const DEFAULT_PAYMENT_METHODS = [
            { id: 'efectivo', name: 'Efectivo', isDefault: true },
            { id: 'transferencia', name: 'Transferencia', isDefault: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('waitcars_session');
            if (!sessionData) {
                window.location.href = 'auth/login.html';
                return;
            }

            // Establecer fecha actual por defecto en el selector
            const todayStr = new Date().toISOString().split('T')[0];
            const datePicker = document.getElementById('agenda-date-picker');
            datePicker.value = todayStr;

            loadAgendaTurnos();
        });

        // FUNCIONES DE DATOS UNIFICADAS CON DASHBOARD
        function getTurnosData() {
            const turnosStandard = JSON.parse(localStorage.getItem('turnos') || '[]');
            const turnosWc = JSON.parse(localStorage.getItem('wc_turnos') || '[]');
            
            const map = new Map();
            [...turnosStandard, ...turnosWc].forEach(t => {
                if (!t.id) t.id = 't_' + Math.random().toString(36).substr(2, 9);
                map.set(t.id, t);
            });
            return Array.from(map.values());
        }

        function saveTurnosData(turnos) {
            localStorage.setItem('turnos', JSON.stringify(turnos));
            localStorage.setItem('wc_turnos', JSON.stringify(turnos));
        }

        function getPaymentMethods() {
            const custom = JSON.parse(localStorage.getItem('wc_payment_methods') || '[]');
            return [...DEFAULT_PAYMENT_METHODS, ...custom];
        }

        function loadAgendaTurnos() {
            const selectedDate = document.getElementById('agenda-date-picker').value;
            const turnos = getTurnosData();
            const container = document.getElementById('agenda-turnos-container');
            container.innerHTML = '';

            // Filtrar turnos de la fecha seleccionada
            const dayTurnos = turnos.filter(t => {
                if (!t.fecha) return false;
                return t.fecha.substring(0, 10) === selectedDate;
            });

            // Ordenar por hora (ej. "10:30")
            dayTurnos.sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));

            if (dayTurnos.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 glass-card rounded-2xl border border-slate-800">
                        <i class="fas fa-calendar-xmark text-4xl text-slate-600 mb-3"></i>
                        <p class="text-xs text-slate-400 font-medium">No hay turnos agendados para la fecha: <span class="text-white font-bold">${selectedDate}</span>.</p>
                        <p class="text-[11px] text-slate-500 mt-1">Prueba seleccionando la fecha en la que creaste los turnos en el Dashboard.</p>
                    </div>
                `;
                return;
            }

            const paymentMethods = getPaymentMethods();

            dayTurnos.forEach(turno => {
                const isPaid = turno.pagado || false;
                const currentMethod = turno.metodoPago || 'efectivo';

                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl border transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 ${isPaid ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800'}`;

                let paymentOptionsHtml = '';
                paymentMethods.forEach(pm => {
                    const selected = currentMethod === pm.id ? 'selected' : '';
                    paymentOptionsHtml += `<option value="${pm.id}" ${selected}>${pm.name}</option>`;
                });

                card.innerHTML = `
                    <div class="flex items-start gap-3 w-full sm:w-auto">
                        <div class="w-12 h-12 rounded-2xl bg-brand-primary/15 border border-brand-primary/30 text-brand-primary font-black text-xs flex flex-col items-center justify-center shrink-0 shadow-inner">
                            <span>${turno.hora || 'S/H'}</span>
                            <span class="text-[9px] text-slate-400 font-normal">hs</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="text-sm font-black text-white">${turno.cliente || turno.nombre || 'Cliente sin nombre'}</h3>
                                ${isPaid ? '<span class="px-2 py-0.5 rounded-full text-[9px] font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Pagado</span>' : '<span class="px-2 py-0.5 rounded-full text-[9px] font-black bg-amber-500/20 text-amber-400 border border-amber-500/30">Pendiente de Pago</span>'}
                            </div>
                            <p class="text-xs text-slate-300 mt-0.5 font-medium"><i class="fas fa-car text-[10px] text-brand-accent mr-1"></i> ${turno.vehiculo || turno.modelo || 'Vehículo general'}</p>
                            <p class="text-[10px] text-slate-400 mt-0.5 font-mono">DNI: ${turno.dni || 'N/A'} | Monto: <span class="text-emerald-400 font-bold">$${(turno.monto || 0).toFixed(2)}</span></p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800">
                        <div class="flex flex-col gap-1">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Medio de Cobro</span>
                            <select 
                                onchange="updateTurnoPaymentMethod('${turno.id}', this.value)" 
                                class="bg-slate-950/80 border border-slate-800 rounded-xl py-1.5 px-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-primary font-medium"
                            >
                                ${paymentOptionsHtml}
                            </select>
                        </div>

                        <div class="flex flex-col gap-1">
                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Estado</span>
                            <button 
                                onclick="toggleTurnoPaidStatus('${turno.id}')" 
                                class="px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${isPaid ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' : 'bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700'}"
                            >
                                <i class="fas ${isPaid ? 'fa-check-circle' : 'fa-circle'}"></i>
                                <span>${isPaid ? 'Cobrado' : 'Marcar Cobrado'}</span>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function toggleTurnoPaidStatus(turnoId) {
            let turnos = getTurnosData();
            const turno = turnos.find(t => t.id === turnoId);
            if (!turno) return;

            turno.pagado = !turno.pagado;
            saveTurnosData(turnos);
            loadAgendaTurnos();
        }

        function updateTurnoPaymentMethod(turnoId, methodId) {
            let turnos = getTurnosData();
            const turno = turnos.find(t => t.id === turnoId);
            if (!turno) return;

            turno.metodoPago = methodId;
            saveTurnosData(turnos);
        }

        function renderPaymentMethodsModal() {
            const listContainer = document.getElementById('payment-methods-list');
            const methods = getPaymentMethods();
            listContainer.innerHTML = '';

            methods.forEach(pm => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-2.5 bg-slate-950/60 border border-slate-800 rounded-xl text-xs";
                
                item.innerHTML = `
                    <span class="font-bold text-slate-200">${pm.name}</span>
                    ${pm.isDefault ? '<span class="text-[9px] text-slate-500 uppercase font-bold px-2 py-0.5 bg-slate-900 rounded-md">Sistema</span>' : `
                        <button onclick="deletePaymentMethod('${pm.id}')" class="text-rose-400 hover:text-rose-300 p-1 transition-all" title="Eliminar método">
                            <i class="fas fa-trash-can text-xs"></i>
                        </button>
                    `}
                `;
                listContainer.appendChild(item);
            });
        }

        function addNewPaymentMethod() {
            const input = document.getElementById('input-nuevo-metodo');
            const name = input.value.trim();

            if (!name) {
                alert('Ingresa el nombre del método de pago.');
                return;
            }

            const customId = 'pay_' + Date.now();
            const customMethods = JSON.parse(localStorage.getItem('wc_payment_methods') || '[]');

            customMethods.push({
                id: customId,
                name: name,
                isDefault: false
            });

            localStorage.setItem('wc_payment_methods', JSON.stringify(customMethods));
            input.value = '';
            renderPaymentMethodsModal();
            loadAgendaTurnos();
        }

        function deletePaymentMethod(id) {
            let customMethods = JSON.parse(localStorage.getItem('wc_payment_methods') || '[]');
            if (!confirm('¿Deseas eliminar este método de pago?')) return;

            customMethods = customMethods.filter(pm => pm.id !== id);
            localStorage.setItem('wc_payment_methods', JSON.stringify(customMethods));
            renderPaymentMethodsModal();
            loadAgendaTurnos();
        }

        function openModal(id) {
            if (id === 'modal-nuevo-metodo') {
                renderPaymentMethodsModal();
            }
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }
    </script>
</body>
</html>
